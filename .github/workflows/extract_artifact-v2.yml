name: Extract & Compress Artifact to Main

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID dari URL workflow perekam (contoh: 12345678901 - WAJIB diisi jika beda workflow)'
        required: false
        default: ''
      artifact_name:
        description: 'Nama artifact yang akan diekstrak'
        required: false
        default: 'hasil-rekaman-stream'
      clip_seconds:
        description: 'Potong video jadi klip per N detik (0 = tidak dipotong, kompres 1 file)'
        required: false
        default: '180'

permissions:
  contents: write
  actions: read

concurrency:
  group: extract-artifact-to-main
  cancel-in-progress: true

jobs:
  extract-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Unzip
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg unzip

      - name: Resolve Run ID & Download Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'hasil-rekaman-stream' }}
        run: |
          mkdir -p ./extracted_artifact

          if [ -n "$INPUT_RUN_ID" ]; then
            TARGET_RUN_ID="$INPUT_RUN_ID"
          else
            # Cari run_id terbaru lintas semua workflow yang memiliki artifact bernama ARTIFACT_NAME
            TARGET_RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}" --jq '.artifacts[0].workflow_run.id // empty')
          fi

          if [ -z "$TARGET_RUN_ID" ]; then
            echo "ERROR: Artifact '${ARTIFACT_NAME}' tidak ditemukan di repository ${{ github.repository }}."
            echo "Daftar artifact yang masih aktif saat ini:"
            gh api "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[] | "- \(.name) | run_id: \(.workflow_run.id) | expired: \(.expired) | size: \(.size_in_bytes)"'
            exit 1
          fi

          echo "Mengunduh artifact '${ARTIFACT_NAME}' dari Run ID: ${TARGET_RUN_ID}..."
          gh run download "$TARGET_RUN_ID" --name "$ARTIFACT_NAME" --dir ./extracted_artifact

      - name: Extract & Process Video for Main Branch
        env:
          CLIP_SECONDS: ${{ inputs.clip_seconds || '180' }}
        run: |
          mkdir -p ./videos

          # Ekstrak file .zip jika ada di dalam folder artifact
          find ./extracted_artifact -type f -name "*.zip" -exec unzip -o {} -d ./extracted_artifact \;

          # Cari file video utama
          SRC_VIDEO=$(find ./extracted_artifact -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" -o -iname "*.ts" -o -iname "*.avi" \) | head -n 1)

          if [ -z "$SRC_VIDEO" ]; then
            echo "Tidak ditemukan file video di dalam artifact."
            ls -la ./extracted_artifact
            exit 1
          fi

          echo "Video ditemukan: $SRC_VIDEO"

          if [ "$CLIP_SECONDS" -gt 0 ] 2>/dev/null; then
            # Pecah menjadi klip berdurasi N detik agar ukuran tiap file aman di bawah batas Git (100 MB)
            ffmpeg -y -i "$SRC_VIDEO" -vf "scale=-2:720" -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 128k -f segment -segment_time "$CLIP_SECONDS" -reset_timestamps 1 -movflags +faststart ./videos/clip-%03d.mp4
          else
            # Kompres ke satu file MP4 ringan untuk web
            ffmpeg -y -i "$SRC_VIDEO" -vf "scale=-2:720" -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 128k -movflags +faststart ./videos/stream_preview.mp4
          fi

          # Hapus file hasil proses yang ukurannya >= 95 MB agar tidak ditolak GitHub (batas 100 MB)
          find ./videos -type f -size +95M -print -delete

          ls -lh ./videos

      - name: Commit & Push Extracted Video to Main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A ./videos

          if ! git diff --staged --quiet; then
            git commit -m "chore: extract and compress stream artifact to videos/"
            git pull --rebase -X ours --autostash origin main || true
            git push origin main
          else
            echo "Tidak ada file video valid (<95MB) untuk di-push ke main."
          fi
