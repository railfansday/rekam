<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LFC vs Club Brugge - Match Recording</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 12px; margin-bottom: 18px;
      padding-bottom: 14px; border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 1.35rem; font-weight: 700; color: #38bdf8; }
    .meta { font-size: 0.9rem; color: #94a3b8; }
    .player-wrap {
      background: #020617; border: 1px solid #1e293b;
      border-radius: 12px; overflow: hidden; margin-bottom: 16px;
    }
    video { width: 100%; max-height: 70vh; display: block; background: #000; }
    .controls {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 10px; padding: 12px 16px;
      background: #0f172a; border-top: 1px solid #1e293b;
    }
    button {
      background: #2563eb; color: #fff; border: none;
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #334155; cursor: not-allowed; }
    .playlist {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px; margin-top: 16px;
    }
    .clip-btn {
      background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      padding: 10px 12px; border-radius: 8px; text-align: left;
      cursor: pointer; transition: 0.15s;
    }
    .clip-btn:hover { border-color: #38bdf8; }
    .clip-btn.active {
      background: #0284c7; border-color: #38bdf8; color: #fff;
    }
    .clip-title { font-weight: 600; font-size: 0.9rem; display: block; }
    .clip-sub { font-size: 0.78rem; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LFC vs Club Brugge - Match Recording</h1>
      <div class="meta" id="statusText">Memuat daftar klip...</div>
    </header>

    <div class="player-wrap">
      <video id="mainPlayer" controls autoplay playsinline preload="metadata"></video>
      <div class="controls">
        <div>
          <button id="prevBtn">Sebelumnya</button>
          <button id="nextBtn">Selanjutnya</button>
        </div>
        <label style="font-size:0.9rem;color:#cbd5e1;cursor:pointer;">
          <input type="checkbox" id="autoNext" checked /> Putar otomatis berurutan
        </label>
      </div>
    </div>

    <div class="playlist" id="playlist"></div>
  </div>

  <script>
    (async function () {
      const player = document.getElementById("mainPlayer");
      const playlistEl = document.getElementById("playlist");
      const statusText = document.getElementById("statusText");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const autoNext = document.getElementById("autoNext");

      let clips = [];

      // 1. Ambil daftar file dari folder videos/ otomatis lewat GitHub API
      try {
        const res = await fetch("https://api.github.com/repos/railfansday/rekam/contents/videos");
        if (res.ok) {
          const items = await res.json();
          clips = items
            .filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".mp4"))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
            .map((item, idx) => ({
              index: idx + 1,
              name: item.name,
              src: "videos/" + item.name,
              size: (item.size / (1024 * 1024)).toFixed(1) + " MB"
            }));
        }
      } catch (e) {}

      // 2. Fallback jika API limit/gagal: deteksi berurutan clip-000.mp4, clip-001.mp4, dst.
      if (!clips.length) {
        for (let i = 0; i < 60; i++) {
          const fname = "clip-" + String(i).padStart(3, "0") + ".mp4";
          const url = "videos/" + fname;
          try {
            const check = await fetch(url, { method: "HEAD" });
            if (check.ok) {
              const bytes = Number(check.headers.get("content-length") || 0);
              clips.push({
                index: clips.length + 1,
                name: fname,
                src: url,
                size: bytes ? (bytes / (1024 * 1024)).toFixed(1) + " MB" : "MP4"
              });
            } else if (i > 0) {
              break;
            }
          } catch (e) {
            break;
          }
        }
      }

      let currentIdx = 0;

      function loadClip(idx, shouldPlay = true) {
        if (!clips.length) {
          statusText.textContent = "Tidak ada klip video ditemukan di folder videos/";
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }
        currentIdx = Math.max(0, Math.min(idx, clips.length - 1));
        const item = clips[currentIdx];
        player.src = item.src;
        statusText.textContent = `Memutar Part ${item.index} / ${clips.length} — ${item.name} (${item.size})`;
        prevBtn.disabled = currentIdx === 0;
        nextBtn.disabled = currentIdx === clips.length - 1;

        document.querySelectorAll(".clip-btn").forEach((el, i) => {
          el.classList.toggle("active", i === currentIdx);
        });
        if (shouldPlay) {
          player.play().catch(() => {});
        }
      }

      playlistEl.innerHTML = "";
      clips.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.className = "clip-btn";
        btn.innerHTML = `<span class="clip-title">Part ${String(item.index).padStart(2, "0")}</span><span class="clip-sub">${item.name} • ${item.size}</span>`;
        btn.onclick = () => loadClip(idx, true);
        playlistEl.appendChild(btn);
      });

      prevBtn.onclick = () => loadClip(currentIdx - 1, true);
      nextBtn.onclick = () => loadClip(currentIdx + 1, true);
      player.addEventListener("ended", () => {
        if (autoNext.checked && currentIdx < clips.length - 1) {
          loadClip(currentIdx + 1, true);
        }
      });

      loadClip(0, false);
    })();
  </script>
</body>
</html>
